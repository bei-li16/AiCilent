# Example configuration — copy to config/providers.yaml and replace URLs and keys.
# 示例模型仅用于说明路由；实际可用模型、思考档位由上游决定。
global:
  listen_addr: ":8080"           # 对外监听；仅本机使用可改为 "127.0.0.1:8080"
  default_format: openai         # 请求格式无法识别时的默认值；通常由 API 路径识别
  # reasoning_effort_on_none: max # OpenAI/Responses/Anthropic 共用；仅显式 none/关闭时触发
                                 # 留空则移除对应控制，使用上游默认，并不保证关闭思考
                                 # 可选 minimal/low/medium/high/xhigh/max；需上游支持
  log_file: ../proxy.log         # 相对配置文件所在目录解析，故此处写到项目根目录
  log_request_body: snippet      # 请求内容日志级别：off=不打印 | snippet=仅打印首条消息前80字符 | full=打印完整请求结构(model/messages/role/stream/tools 等)，full 整段 body 仅落盘不进 SSE
  cb_threshold: 3                # 熔断阈值，同一优先级组连续失败次数达到此值后熔断
  cb_cooldown: 10                # 熔断冷却时间（秒），熔断后等待此时间后尝试恢复
  cb_skip_requests: 1            # 熔断期间跳过请求的计数门槛；详见 README
  control_allow_remote: false    # false 仅允许 loopback 调用管理写接口；修改需重启
  max_stream_minutes: 15         # 单次流式上游尝试的总时限（分钟），含连接/响应头/读流
                                 # 省略或 <=0 默认 3；不是整个客户端请求跨重试的总时限
  rate_limit_cooldown: 0         # <=0 关闭；同 provider 重试耗尽仍为 429 后的可选冷却秒数
                                 # 按 provider name 冷却，不是自动识别上游共享配额

# 同组调度：当前并发最少 -> 最久未开始尝试 -> 稳定顺序；成功后不粘账号。
# 账号按协议 + 上游 scheme/host/port + API Key 识别；同协议同 Key 的模型共享负载。
# OpenAI（含 Responses）与 Anthropic 独立调度；全忙时仍选最小并发，无容量上限/排队。
# 旧 max_concurrent 已移除；CLI 忽略旧字段，GUI 迁移/保存时删除。

model_routes:                    # 模型路由别名映射，将别名映射到实际 provider
  - alias: gpt-4o                # 对外暴露的模型别名
    target: glm-a                # provider name：优先该组，其余组仍可兜底
  - alias: gpt-4o-mini
    target: deepseek-a
  - alias: default               # 默认路由，请求中模型不在路由表时使用
    target: glm-a
  # target 也可填路由关键词，语义与客户端直发该关键词完全一致（硬性档位，档外不兜底）；
  # target 同时匹配关键词和供应商名时按关键词解释（档位优先）：
  # - alias: best
  #   target: P1                # ≡ 直发 P1：仅优先级 1 组，全败不跨组兜底
  # - alias: fast
  #   target: Flash             # ≡ 直发 Flash：跳过最高优先级组
  # - alias: cheap
  #   target: P2down            # ≡ 直发 P2down：从 P2 到最低档依次降级

model_rules:                      # 匹配客户端原始 model（含别名），不是替换后的 model_id
  - model: gpt-4o
    defaults:
      temperature: 0.2
      max_tokens: 4096
      timeout: 45                  # 特殊代理默认参数，不写入上游正文；覆盖 provider timeout
                                   # 与 provider timeout 的计时范围相同，不是跨账号总时限

providers:                       # 供应商列表，按优先级从高到低降级（受路由档位约束）
  # 每个账号的模型/协议分别配置；增加账号时复制条目，使用唯一 name 和不同 Key。
  # 相同占位 Key 代表同账号，不代表上游 RPM/TPM 配额一定共享或一定独立。

  # ════════ OpenAI 格式示例 ════════
  - name: kimi-a                 # 供应商唯一标识名
    vendor: openai               # 供应商类型，openai=兼容 OpenAI API 格式，anthropic=兼容 Anthropic API 格式
    model_id: kimi-k3            # 实际发送给上游的模型名称
    api_key: YOUR_ACCOUNT_A_API_KEY
    base_url: https://api.example.com/v1  # openai 追加 /chat/completions，勿以 / 结尾
    priority: 1                  # 优先级（数字越小越优先），失败后降级到下一优先级
    format: openai               # Chat/Responses 请求只选 openai 条目
    auth_type: bearer            # OpenAI 使用 Authorization: Bearer <api_key>
    timeout: 60                  # 秒；非流式为单次上游总时限，流式为响应头/读空闲时限
    retry:                       # 重试策略
      max_retries: 3             # 首次之外最多再试 3 次，总计最多 4 次；省略或 0 仍默认 3
      retry_interval: 1          # 相邻尝试开始时刻的间隔基数（秒），响应耗时计入此间隔
      backoff_factor: 2          # 第 n 次重试目标间隔 = retry_interval * factor^(n-1)
    rate_limit:                 # 可选本地令牌桶，不是并发上限，也不是上游实际配额
      enabled: false            # 默认关闭；令牌不足时跳过该候选，不等待
      rpm: 60                   # 按 provider name 独立，同账号其他模型不共用此桶
      burst: 10                 # 桶容量/最大瞬发令牌数；候选内部重试不逐次扣除

  # ════════ Anthropic 格式示例（auth_type: bearer，base_url 无 /v1）════════
  - name: kimi-a-anthropic
    vendor: anthropic             # 供应商类型为 anthropic，使用 x-api-key 或 bearer 认证
    model_id: kimi-k3
    api_key: YOUR_ACCOUNT_A_API_KEY
    base_url: https://api.example.com  # Anthropic 格式 base_url 不含 /v1
    priority: 1
    format: anthropic             # Messages 请求只选 anthropic 条目，不跨协议兜底
    auth_type: bearer             # 可选 x-api-key；省略时 anthropic 默认 x-api-key
                                  # 两种认证均发送 anthropic-version: 2023-06-01
    timeout: 60
    retry:
      max_retries: 3
      retry_interval: 1
      backoff_factor: 2

  # ════════ 低价位供应商示例（演示跨优先级降级）════════
  - name: glm-a                    # 上面 model_routes 中 gpt-4o / default 的 target
    vendor: openai
    model_id: glm-5.3
    api_key: YOUR_ACCOUNT_A_API_KEY
    base_url: https://api.example.com/v1
    priority: 2
    format: openai
    timeout: 60
    retry:
      max_retries: 3
      retry_interval: 1
      backoff_factor: 2

  - name: glm-a-anthropic
    vendor: anthropic
    model_id: glm-5.3
    api_key: YOUR_ACCOUNT_A_API_KEY
    base_url: https://api.example.com
    priority: 2
    format: anthropic
    auth_type: bearer
    timeout: 60
    retry:
      max_retries: 3
      retry_interval: 1
      backoff_factor: 2

  - name: deepseek-a              # 上面 model_routes 中 gpt-4o-mini 的 target
    vendor: openai
    model_id: deepseek-flash
    api_key: YOUR_ACCOUNT_A_API_KEY
    base_url: https://api.example.com/v1
    priority: 3
    format: openai
    timeout: 60
    retry:
      max_retries: 3
      retry_interval: 1
      backoff_factor: 2

  - name: deepseek-a-anthropic
    vendor: anthropic
    model_id: deepseek-flash
    api_key: YOUR_ACCOUNT_A_API_KEY
    base_url: https://api.example.com
    priority: 3
    format: anthropic
    auth_type: bearer
    timeout: 60
    retry:
      max_retries: 3
      retry_interval: 1
      backoff_factor: 2
